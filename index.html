<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Controle de Sala 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

  :root {
    --red: #e94560;
    --red-dark: #c0392b;
    --red-glow: rgba(233,69,96,0.4);
    --bg: #050508;
    --bg2: #0a0a10;
    --bg3: #0f0f18;
    --card: #0d0d16;
    --card2: #12121e;
    --border: rgba(233,69,96,0.25);
    --border-bright: rgba(233,69,96,0.7);
    --text: #e8e8f0;
    --text-dim: #7a7a9a;
    --text-bright: #ffffff;
    --green: #00ff88;
    --green-dim: rgba(0,255,136,0.15);
    --blue: #00b4ff;
    --orange: #ff8c00;
    --purple: #b060ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(233,69,96,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(233,69,96,0.05) 0%, transparent 50%);
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  .header {
    background: linear-gradient(180deg, #0a0a12 0%, #080810 100%);
    border-bottom: 1px solid var(--border-bright);
    padding: 24px 36px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    box-shadow: 0 0 20px var(--red-glow);
  }
  .header::after {
    content: '';
    position: absolute;
    top: -50%; left: -10%;
    width: 120%; height: 200%;
    background: radial-gradient(ellipse, rgba(233,69,96,0.04) 0%, transparent 60%);
    pointer-events: none;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 900;
    color: var(--text-bright);
    letter-spacing: 2px;
    text-shadow: 0 0 20px var(--red-glow);

<head>

<title>Dashboard | Controle de Sala 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:          #000000;
  --bg1:         #030000;
  --bg2:         #060000;
  --card:        #080000;
  --card2:       #0c0000;
  --border:      rgba(160,0,20,0.22);
  --border-hot:  rgba(200,0,30,0.55);
  --r1:          #7a0010;
  --r2:          #aa0018;
  --r3:          #cc0022;
  --r4:          #ee1133;
  --glow-sm:     rgba(200,0,30,0.35);
  --glow-md:     rgba(200,0,30,0.55);
  --glow-lg:     rgba(200,0,30,0.75);
  --txt:         #f2d9d9;
  --txt-dim:     #7a4444;
  --txt-muted:   #3d2020;
  --txt-bright:  #fff0f0;
  --cyan:        #00f5d4;
  --cglow:       rgba(0,245,212,0.45);
  --gold:        #f5c842;
  --gglow:       rgba(245,200,66,0.45);
  --purple:      #c044f0;
  --pglow:       rgba(192,68,240,0.45);
  --green:       #00f070;
  --nglow:       rgba(0,240,112,0.45);
  --orange:      #f56020;
  --oglow:       rgba(245,96,32,0.45);
  --blue:        #2080ff;
  --bglow:       rgba(32,128,255,0.45);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════
   BACKGROUND LAYERS
═══════════════════════════════════ */
.bg-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}

/* Grade */
.bg-grid {
  background-image:
    linear-gradient(rgba(150,0,20,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(150,0,20,0.055) 1px, transparent 1px);
  background-size: 48px 48px;
  animation: gridBreath 5s ease-in-out infinite;
}
@keyframes gridBreath {
  0%,100% { opacity:.5 }
  50%      { opacity:1  }
}

/* Radial glows */
.bg-glow {
  background:
    radial-gradient(ellipse 55% 40% at 10% 15%, rgba(150,0,20,0.10) 0%, transparent 100%),
    radial-gradient(ellipse 40% 50% at 90% 85%, rgba(150,0,20,0.08) 0%, transparent 100%),
    radial-gradient(ellipse 60% 30% at 50% 50%, rgba(80,0,10,0.05) 0%, transparent 100%);
  animation: glowShift 8s ease-in-out infinite alternate;
}
@keyframes glowShift {
  0%   { transform: scale(1)    rotate(0deg); }
  100% { transform: scale(1.06) rotate(1.5deg); }
}

/* Scan lines */
.bg-scan {
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.12) 3px,
    rgba(0,0,0,0.12) 4px
  );
  animation: scanMove 20s linear infinite;
}
@keyframes scanMove {
  from { background-position: 0 0; }
  to   { background-position: 0 100vh; }
}

/* Noise overlay */
.bg-noise {
  opacity: .018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ═══════════════════════════════════
   HEADER
═══════════════════════════════════ */
.header {
  position: relative; z-index: 2;
  padding: 0;
  background: linear-gradient(180deg, rgba(12,0,0,1) 0%, rgba(4,0,0,1) 100%);
}

.header-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--r2) 20%,
    var(--r4) 50%,
    var(--r2) 80%,
    transparent 100%);
  box-shadow: 0 0 30px var(--glow-lg), 0 0 80px var(--glow-md);
  animation: accentPulse 2.5s ease-in-out infinite;
}
@keyframes accentPulse {
  0%,100% { opacity:.7; box-shadow: 0 0 20px var(--glow-md); }
  50%      { opacity:1;  box-shadow: 0 0 50px var(--glow-lg), 0 0 100px var(--glow-sm); }
}

.header-bottom-line {
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%, rgba(150,0,20,0.4) 30%,
    rgba(200,0,30,0.6) 50%, rgba(150,0,20,0.4) 70%, transparent 100%);
}

.header-inner {
  max-width: 1300px; margin: 0 auto;
  padding: 30px 32px 26px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 20px;
}

.header-left { display: flex; align-items: center; gap: 20px; }

/* Anel pulsante */
.logo-ring {
  position: relative; flex-shrink: 0;
  width: 58px; height: 58px;
}
.logo-ring::before, .logo-ring::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 1px solid var(--r3);
  animation: ringExpand 2.2s ease-out infinite;
}
.logo-ring::after { animation-delay: 1.1s; }
@keyframes ringExpand {
  0%   { transform: scale(1);   opacity: .8; }
  100% { transform: scale(1.7); opacity: 0; }
}
.logo-core {
  position: absolute; inset: 8px;
  background: radial-gradient(circle at center, var(--r2) 0%, #400000 70%);
  border-radius: 50%;
  border: 1px solid var(--r3);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif;
  font-size: 14px; font-weight: 900; color: #fff8f8;
  box-shadow: 0 0 20px var(--glow-lg), inset 0 0 14px rgba(255,80,80,0.2);
  animation: corePulse 2.2s ease-in-out infinite;
}
@keyframes corePulse {
  0%,100% { box-shadow: 0 0 16px var(--glow-md); }
  50%      { box-shadow: 0 0 34px var(--glow-lg), 0 0 70px var(--glow-sm); }
}

.header-titles {}
.header-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 5px;
  color: var(--r3); text-transform: uppercase;
  margin-bottom: 6px;
  text-shadow: 0 0 12px var(--glow-md);
  animation: eyeBlink 3s ease-in-out infinite;
}
@keyframes eyeBlink {
  0%,100% { opacity:.7; }
  50%      { opacity:1; text-shadow: 0 0 20px var(--glow-lg); }
}
.header-title {
  font-family: 'Cinzel', serif;
  font-size: 24px; font-weight: 900;
  color: var(--txt-bright);
  letter-spacing: 1px;
  line-height: 1.15;
  text-shadow: 0 0 40px rgba(200,0,30,0.3), 0 2px 4px rgba(0,0,0,0.8);
}
.header-title em {
  color: var(--r4);
  font-style: normal;
  text-shadow: 0 0 24px var(--glow-lg), 0 0 60px var(--glow-md);
  animation: titleGlow 2s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% { text-shadow: 0 0 16px var(--glow-md); }
  50%      { text-shadow: 0 0 36px var(--glow-lg), 0 0 80px var(--glow-sm); }
}
.header-sub {
  margin-top: 7px;
  font-size: 12px; color: var(--txt-dim);
  font-weight: 400; letter-spacing: .3px;
  line-height: 1.6;
}
.header-sub strong
